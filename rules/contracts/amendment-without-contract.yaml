schema_version: "1.0"
rule_version: "0.1.0"
origin: cross_reference

description:
  language: pt-BR
  title: "Termo aditivo sem contrato correspondente no extrato"
  title_translations:
    en: "Amendment without a matching contract in the extract"
  text: >
    Confere se o número do contrato de cada termo aditivo existe no extrato de contratos.
  justification: >
    Todo aditivo pertence a um contrato; aditivo cujo contrato não aparece no extrato indica vínculo
    quebrado ou extratos de coberturas diferentes. Ausência no extrato não prova inexistência do
    contrato no sistema de origem (mesma família de IB-17 no IBAMA). É sinal para revisão.
  exceptions:
    - "Contratos antigos podem não constar do extrato publicado."
  examples:
    - case: "Aditivo do contrato 1234.2023/0001 presente no extrato"
      expected: "Conforme"
    - case: "Aditivo de contrato ausente do extrato"
      expected: "Sinalizar"

sources:
  recife_aditivos:
    portal: https://dados.recife.pe.gov.br
    dataset: contratos
    resource: {name: "Termo Aditivo", format: CSV}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      num_contrato: "Número do contrato a que o aditivo pertence"
      data_inicio_vigencia: {meaning: "Início da vigência do aditivo", type: date, format: "%Y-%m-%d"}
  recife_contratos:
    portal: https://dados.recife.pe.gov.br
    dataset: contratos
    resource: {name: "Contratos", format: CSV}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      numerocontrato: "Número do contrato"

check:
  template: lookup-exists
  timeline: recife_aditivos.data_inicio_vigencia
  key: {from: recife_aditivos.num_contrato, to: recife_contratos.numerocontrato}
