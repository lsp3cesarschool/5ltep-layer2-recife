schema_version: "1.0"
rule_version: "0.1.0"
origin: expert

description:
  language: pt-BR
  title: "Coordenada do empreendimento licenciado fora do Recife"
  title_translations:
    en: "Licensed enterprise located outside Recife"
  text: >
    Sinaliza processos de licenciamento com coordenada fora do retângulo que contém o município do Recife (latitude de -8,17 a -7,92; longitude de -35,03 a -34,85).
  justification: >
    A prefeitura licencia empreendimentos no próprio município; coordenada fora do retângulo do Recife
    indica erro de sinal, de eixo trocado ou de geocodificação. O retângulo é uma aproximação do limite
    municipal: um ponto dentro dele ainda pode estar em município vizinho. Coordenadas com ponto decimal.
    É sinal para revisão.
  exceptions:
    - "Processos sem coordenada ficam fora do escopo."
  examples:
    - case: "Latitude -8.05, longitude -34.90"
      expected: "Conforme"
    - case: "Latitude -34.90, longitude -8.05"
      expected: "Sinalizar"

sources:
  recife_licencas:
    portal: https://dados.recife.pe.gov.br
    dataset: licenciamento-ambiental
    resource: {name: "Licenciamento Ambiental", format: CSV}
    file: {format: csv, encoding: utf-8, delimiter: ";"}
    columns:
      latitude: {meaning: "Latitude do empreendimento", type: number, decimal: "."}
      longitude: {meaning: "Longitude do empreendimento", type: number, decimal: "."}
      data_entrada: {meaning: "Data de entrada do processo", type: date, format: "%Y-%m-%d"}

check:
  template: flag-when
  timeline: recife_licencas.data_entrada
  any:
    - {column: recife_licencas.latitude, below: -8.17}
    - {column: recife_licencas.latitude, above: -7.92}
    - {column: recife_licencas.longitude, below: -35.03}
    - {column: recife_licencas.longitude, above: -34.85}
  where:
    - {column: recife_licencas.latitude, empty: false}
